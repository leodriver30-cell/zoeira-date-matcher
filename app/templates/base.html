<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ t('app_title') }}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        romantic: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 text-white min-h-screen flex flex-col selection:bg-rose-500 selection:text-white">
    
    <!-- Barra Superior de Navegação & Seletor de Idioma -->
    <header class="w-full border-b border-white/10 backdrop-blur-md bg-black/20 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/?lang={{ lang }}" class="flex items-center gap-2 group">
                <span class="text-2xl transition-transform group-hover:scale-110">🐾</span>
                <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-pink-400 via-rose-300 to-amber-200 bg-clip-text text-transparent">
                    {{ t('app_title') }}
                </span>
            </a>

            <!-- Seletor de Idioma Dinâmico -->
            <div class="relative flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full border border-white/15 text-sm backdrop-blur-md">
                <span class="text-xs opacity-70">🌐</span>
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-transparent text-white font-semibold focus:outline-none cursor-pointer text-xs sm:text-sm">
                    <option value="pt" class="bg-slate-900 text-white" {% if lang == 'pt' %}selected{% endif %}>🇧🇷 Português</option>
                    <option value="ja" class="bg-slate-900 text-white" {% if lang == 'ja' %}selected{% endif %}>🇯🇵 日本語</option>
                    <option value="en" class="bg-slate-900 text-white" {% if lang == 'en' %}selected{% endif %}>🇺🇸 English</option>
                    <option value="es" class="bg-slate-900 text-white" {% if lang == 'es' %}selected{% endif %}>🇪🇸 Español</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="w-full text-center py-4 text-xs text-white/40 border-t border-white/5">
        <p>{{ t('footer_text') }}</p>
    </footer>

    <!-- Dados i18n para Scripts JS -->
    <script>
        window.CURRENT_LANG = "{{ lang }}";
        window.TRANSLATIONS = {{ translations | tojson | safe }};
        function t(key, params = {}) {
            const lang = window.CURRENT_LANG || 'pt';
            let val = (window.TRANSLATIONS[lang] && window.TRANSLATIONS[lang][key]) || 
                      (window.TRANSLATIONS['pt'] && window.TRANSLATIONS['pt'][key]) || key;
            if (typeof val === 'string') {
                for (const [k, v] of Object.entries(params)) {
                    val = val.replace(new RegExp(`{${k}}`, 'g'), v);
                }
            }
            return val;
        }
        function changeLanguage(newLang) {
            localStorage.setItem("preferred_lang", newLang);
            const url = new URL(window.location.href);
            url.searchParams.set('lang', newLang);
            window.location.href = url.toString();
        }
    </script>
    <script src="/static/js/i18n.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
